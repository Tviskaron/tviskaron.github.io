design:
  theme: sb2nov
  entries:
    date_and_location_width: 3.45cm
  sections:
    space_between_regular_entries: 0.65em
  typography:
    font_size:
      name: 22pt
  header:
    space_below_name: 0.4cm
    space_below_headline: 0.4cm
    space_below_connections: 0.4cm
    connections:
      separator: ""
      show_icons: true
      display_urls_instead_of_usernames: false
  page:
    top_margin: 1.2cm
    bottom_margin: 1.2cm
    left_margin: 1.2cm
    right_margin: 1.2cm
    show_top_note: false
  templates:
    publication_entry:
      main_column: |-
        **JOURNAL** -- TITLE. AUTHORS
      date_and_location_column: DATE
locale:
  language: english
settings:
  current_date: today
  render_command:
    output_folder: rendercv_output
